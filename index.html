<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مفرداتي</title>
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#11151E" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="مفرداتي"><link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout idea: a shelf of ten index-card decks; every deck shows its 35 word slots as a grid, so what you know is visible at a glance. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#172033; --muted:#5B677D; --line:#D9DFEA;
  --cb1:#FFE7B8; --cf1:#9A5B00; --cb2:#FFD3A8; --cf2:#A33F00; --cb3:#FFC2CF; --cf3:#B0123F;
  --accent:#3B4CCA; --ok:#13865A; --ok-soft:#DDF3E9; --miss:#CC3D34; --miss-soft:#FBE3E1; --idle:#CBD2DF;
  --shadow:0 1px 0 rgba(23,32,51,.06), 0 8px 24px -14px rgba(23,32,51,.28);
  --f-ar:"Readex Pro","Segoe UI",Tahoma,sans-serif;
  --f-en:"Bricolage Grotesque","Readex Pro","Segoe UI",sans-serif;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151E; --surface:#1A202C; --ink:#E7EBF3; --muted:#9AA6BC; --line:#2C3445;
    --cb1:#4A3510; --cf1:#FFC965; --cb2:#52270C; --cf2:#FF9C57; --cb3:#561528; --cf3:#FF7FA0;
  --accent:#8E9BFF; --ok:#4CC995; --ok-soft:#173A2C; --miss:#FF7A70; --miss-soft:#47201E; --idle:#3A4357;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151E; --surface:#1A202C; --ink:#E7EBF3; --muted:#9AA6BC; --line:#2C3445;
  --cb1:#4A3510; --cf1:#FFC965; --cb2:#52270C; --cf2:#FF9C57; --cb3:#561528; --cf3:#FF7FA0;
  --accent:#8E9BFF; --ok:#4CC995; --ok-soft:#173A2C; --miss:#FF7A70; --miss-soft:#47201E; --idle:#3A4357;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.brand .lvl{font-family:var(--f-en);font-weight:800;font-size:15px;color:var(--accent);direction:ltr}
.lead{color:var(--muted);margin:6px 0 22px;max-width:56ch}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.iconbtn:hover{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.stat b{display:block;font-family:var(--f-en);font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.stat.ok b{color:var(--ok)} .stat.miss b{color:var(--miss)}
.spot{position:relative;overflow:hidden;background:var(--ink);color:var(--bg);border-radius:22px;padding:22px 22px 18px;margin-bottom:26px;display:grid;gap:6px}
.spot::after{content:"";position:absolute;inset-inline-end:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 70%,transparent),transparent 70%);opacity:.55;pointer-events:none}
.spot .lab{font-size:13.5px;opacity:.75;display:flex;justify-content:space-between;gap:10px;align-items:center}
.spot .lab .tg{font-family:var(--f-en);direction:ltr;background:var(--c);color:#fff;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;opacity:1}
.spot .wl{display:flex;align-items:center;justify-content:flex-end;gap:12px;direction:ltr}
.spot .en{font-size:42px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.spot .ar{font-size:18px;font-weight:500}
.spot .ex{font-family:var(--f-en);direction:ltr;text-align:left;opacity:.82;font-size:16px;margin:2px 0 6px}
.spot .ex mark{background:transparent;color:inherit;text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:3px;text-underline-offset:4px}
.spot .say{border-color:color-mix(in srgb,var(--bg) 30%,transparent);color:var(--bg)}
.spot .row{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.spot .btn{min-height:38px;background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 30%,transparent);font-size:14px}
.spot .btn:hover{border-color:var(--bg)}
.decks{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:620px){.decks{grid-template-columns:1fr;gap:14px}.brand h1{font-size:34px}.slots{gap:3px}.slot{aspect-ratio:3/1}.deck{padding:28px 14px 14px;gap:8px}.stat{padding:10px 12px}.stat b{font-size:24px}.stat span{font-size:13px}.spot .en{font-size:34px}}
.deck{position:relative;text-align:start;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 7%,var(--surface)),var(--surface) 55%);border:1px solid var(--line);border-radius:var(--r-lg);padding:30px 16px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:transform .15s ease,border-color .15s}
.deck:hover{transform:translateY(-2px);border-color:var(--c)}
.deck .tab{position:absolute;top:-1px;inset-inline-start:18px;background:var(--c);color:#fff;font-family:var(--f-en);font-weight:600;font-size:12.5px;padding:3px 12px 4px;border-radius:0 0 10px 10px;direction:ltr}
.deck h2{margin:0;font-size:19px;font-weight:600}
.deck .meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13.5px}
.deck .meta .en{font-weight:600;color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;direction:rtl}
.slot{aspect-ratio:2.2/1;border-radius:4px;background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.slot.k{background:var(--ok)} .slot.m{background:var(--miss)}
.slot.e{background:transparent;border:1.5px dashed var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:18px 2px 0}
.legend i{display:inline-block;width:14px;height:8px;border-radius:3px;margin-inline-end:6px;vertical-align:middle;background:color-mix(in srgb,var(--accent) 25%,var(--surface))}
.legend i.k{background:var(--ok)} .legend i.m{background:var(--miss)} .legend i.e{background:transparent;border:1.5px dashed var(--line)}
.foot{margin-top:32px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.sync{display:inline-flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.sync.cloud i{background:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover{border-color:var(--c,var(--accent))}
.btn.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line)}
.btn.danger{color:var(--miss)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);background:none;border:0;padding:6px 0;font-size:15px}
.back svg{width:18px;height:18px}
.back:hover{color:var(--ink)}
.dhead{margin:10px 0 18px;padding-inline-start:16px;border-inline-start:6px solid var(--c)}
.dhead .en{color:var(--c);font-weight:600;font-size:14px}
.dhead h2{margin:2px 0 4px;font-size:28px;font-weight:700;line-height:1.25}
.dhead p{margin:0;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-family:var(--f-en);font-weight:600;margin-inline-start:4px}
.list{display:flex;flex-direction:column;gap:8px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.word.open{border-color:var(--c)}
.wrow{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;width:100%;padding:12px 14px;background:none;border:0;text-align:start}
.wrow .mark{width:9px;height:9px;border-radius:50%;background:var(--idle)}
.wrow .mark.k{background:var(--ok)} .wrow .mark.m{background:var(--miss)}
.wrow .w{display:flex;flex-direction:column;min-width:0}
.wrow .w .en{font-size:19px;font-weight:600;text-align:right;line-height:1.3;overflow-wrap:anywhere}
.wrow .w .ar{color:var(--muted);font-size:14.5px}
.wrow .chev{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.word.open .chev{transform:rotate(180deg)}
.say{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.say svg{width:17px;height:17px}
.say:hover{color:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.wbody{padding:0 14px 14px;display:none}
.word.open .wbody{display:block}
.sents{margin:0;padding:12px 16px;list-style:none;border-radius:var(--r-sm);background:var(--bg);display:flex;flex-direction:column;gap:8px}
.sents li{font-family:var(--f-en);direction:ltr;text-align:left;font-size:16px;line-height:1.55}
.sents mark{background:transparent;color:var(--c,var(--accent));font-weight:700}
.wtools{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.wtools .btn{min-height:36px;padding:0 12px;font-size:14px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r-md);padding:24px;text-align:center;color:var(--muted)}
.note{color:var(--muted);font-size:14px;margin:10px 2px}
@media (hover:none){.kbd{display:none}}
@media (max-width:520px){.card{min-height:400px}}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.qcount{font-family:var(--f-en);font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);direction:ltr}
.qside{display:flex;align-items:center;gap:8px}
.tog{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none}
.tog svg{width:19px;height:19px}
.tog[aria-pressed="true"]{color:var(--c);border-color:var(--c)}
.combo{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-en);font-weight:800;font-size:16px;direction:ltr;padding:5px 11px 5px 9px;border-radius:99px;background:var(--cb1);color:var(--cf1);opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1),background .3s,color .3s}
.combo svg{width:16px;height:16px}
.combo.on{opacity:1;transform:scale(1)}
.combo[data-l="2"]{background:var(--cb2);color:var(--cf2)}
.combo[data-l="3"]{background:var(--cb3);color:var(--cf3)}
.combo.bump{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.28)}}
.track{display:flex;gap:3px;margin-bottom:26px}
.track i{flex:1;height:8px;border-radius:3px;background:var(--line);transition:background .25s}
.track i.cur{background:var(--c);opacity:.5}
.track i.ok{background:var(--ok)}
.track i.miss{background:var(--miss)}
.prompt{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:34px 20px;text-align:center;margin-bottom:18px;animation:pin .34s cubic-bezier(.2,.8,.2,1) both;transition:border-color .2s,box-shadow .2s}
.prompt.good{border-color:var(--ok);box-shadow:0 0 0 5px var(--ok-soft)}
.prompt.bad{border-color:var(--miss);box-shadow:0 0 0 5px var(--miss-soft)}
@keyframes pin{from{opacity:0;transform:translateX(-36px)}}
.prompt small{display:block;color:var(--muted);font-size:14px;margin-bottom:8px}
.prompt .ar{font-size:32px;font-weight:600;line-height:1.35;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}.prompt .ar{font-size:27px}}
.opt{position:relative;display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 16px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);text-align:start;animation:oin .32s cubic-bezier(.2,.8,.2,1) both}
.opt:nth-child(2){animation-delay:.04s}.opt:nth-child(3){animation-delay:.08s}.opt:nth-child(4){animation-delay:.12s}
@keyframes oin{from{opacity:0;transform:translateY(12px)}}
.opt.hit{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
.opt.wrong{animation:shake .42s}
@keyframes pop{40%{transform:scale(1.06)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.spark{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;pointer-events:none;animation:spark .6s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes spark{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
.opt .k{font-family:var(--f-en);font-size:13px;color:var(--muted);width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.opt .en{font-size:21px;font-weight:600;flex:1;text-align:right}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--miss);background:var(--miss-soft)}
.opt[disabled]{cursor:default}
.prompt .reveal{height:52px;display:flex;align-items:flex-end;justify-content:center}
.prompt .qen{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-en);font-weight:800;font-size:38px;line-height:1.2;color:var(--c);overflow-wrap:anywhere}
.prompt .reveal .mean{font-size:26px;font-weight:600;line-height:1.3;animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .prompt .qen{color:color-mix(in srgb, var(--c) 55%, #fff)}}
:root[data-theme="dark"] .prompt .qen{color:color-mix(in srgb, var(--c) 55%, #fff)}
.selfq{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sbtn{position:relative;min-height:76px;border-radius:var(--r-md);border:2px solid;background:var(--surface);font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;animation:oin .32s cubic-bezier(.2,.8,.2,1) both}
.sbtn:nth-child(2){animation-delay:.05s}
.sbtn svg{width:22px;height:22px}
.sbtn.k{border-color:var(--ok);color:var(--ok)}
.sbtn.m{border-color:var(--miss);color:var(--miss)}
.sbtn.k.on{background:var(--ok-soft)}
.sbtn.m.on{background:var(--miss-soft)}
.sbtn.on.k{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
.sbtn[disabled]{cursor:default}
.sbtn[disabled]:not(.on){opacity:.45}
.modes{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;padding:16px 18px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--bg)}
.mode b{font-size:18px}
.mode span{color:var(--muted);font-size:14.5px}
.mode:hover,.mode:focus-visible{border-color:var(--c)}
.mode.last{border-color:var(--c)}
.res{text-align:center;padding:10px 0 18px}
.res .score{font-family:var(--f-en);font-weight:800;font-size:72px;line-height:1;direction:ltr;font-variant-numeric:tabular-nums}
.res .score small{font-size:30px;color:var(--muted);font-weight:600}
.res p{color:var(--muted);margin:10px 0 0}
.res .score{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.rstats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.rstats span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14.5px}
.rstats b{font-family:var(--f-en);font-variant-numeric:tabular-nums}
.rstats .up{color:var(--ok);font-weight:600;font-style:normal}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.rlists{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
@media (max-width:620px){.rlists{grid-template-columns:1fr}}
.rbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.rbox h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}
.rbox h3 i{width:9px;height:9px;border-radius:50%}
.rbox ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rbox li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.rbox li:first-child{border-top:0}
.rbox li .en{font-weight:600;font-size:16.5px}
.rbox li span{color:var(--muted);font-size:14px}
/* cards */
.stage{perspective:1400px;margin:6px 0 16px}
.card{position:relative;width:100%;min-height:330px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;border-top:6px solid var(--c)}
.face.back{transform:rotateY(180deg);justify-content:flex-start;overflow:auto}
.face .side{position:absolute;top:12px;inset-inline-end:16px;font-size:12.5px;color:var(--muted)}
.face .ar{font-size:34px;font-weight:600;text-align:center;line-height:1.35;text-wrap:balance}
.face .hint{color:var(--muted);font-size:14px}
.face .bigen{display:flex;align-items:center;gap:10px;margin-top:8px}
.face .bigen .en{font-size:38px;font-weight:800;color:var(--c);line-height:1.1}
.face .sents{width:100%}
.cnav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cnav .mid{display:flex;gap:8px}
.cnav .pos{font-family:var(--f-en);color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums}
.selfrate{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.selfrate .btn.k{border-color:var(--ok);color:var(--ok)}
.selfrate .btn.m{border-color:var(--miss);color:var(--miss)}
@media (prefers-reduced-motion: reduce){
  .card{transition:none}
  .deck,.chev,.track i,.combo{transition:none}
  .prompt,.opt,.opt.hit,.opt.wrong,.combo.bump,.res .score,.sbtn,.sbtn.on.k,.prompt .reveal .mean{animation:none}
}
/* sheet / dialog */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.5);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-radius:20px;border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.45);padding:22px}
.sheet h3{margin:0 0 4px;font-size:21px}
.sheet .sub{color:var(--muted);margin:0 0 16px;font-size:14.5px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:500;font-size:14.5px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field input.en,.field textarea.en{text-align:left;font-size:16.5px}
.field textarea{resize:vertical;min-height:58px}
.field .err{color:var(--miss);font-size:13.5px}
.field .warn{color:#B07300;font-size:13.5px}
:root[data-theme="dark"] .field .warn{color:#E3B34C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .field .warn{color:#E3B34C}}
.row2{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);z-index:60;max-width:calc(100% - 24px);font-size:15px}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;padding:4px 12px;font-weight:600}
.banner{background:var(--miss-soft);color:var(--ink);border-radius:var(--r-md);padding:10px 14px;margin-bottom:16px;font-size:14.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

      <button class="chip" aria-pressed="${!C.missOnly}" data-act="cfilter" data-f="all">كل البطاقات</button>
      <button class="chip" aria-pressed="${C.missOnly}" data-act="cfilter" data-f="m" ${missN ? "" : "disabled"}>ما فاتني فقط<b>${missN}</b></button>
      <button class="chip" aria-pressed="${!!C.shuffled}" data-act="cshuffle">خلط الترتيب</button>
    </div>
    <div class="stage">
      <div class="card${C.flip ? " flip" : ""}" data-act="flip" role="button" tabindex="0" aria-label="اقلب البطاقة">
        <div class="face front"><span class="side">الوجه</span><div class="ar">${esc(w.ar)}</div><div class="hint">تذكّر الكلمة الإنجليزية، ثم اضغط لتقلب البطاقة</div></div>
        <div class="face back"><span class="side">الظهر</span>
          <div class="bigen"><span class="en">${esc(w.en)}</span>${sayBtn(w.en)}</div>
          <div class="hint">${esc(w.ar)}</div>
          <ol class="sents">${w.s.filter(Boolean).map(x => `<li>${hl(x, w.en)}</li>`).join("")}</ol>
        </div>
      </div>
    </div>
    ${C.flip ? `<div class="selfrate"><button class="btn k" data-act="rate" data-r="k">عرفتها</button><button class="btn m" data-act="rate" data-r="m">ما عرفتها</button></div>` : ""}
    <div class="cnav">
      <button class="btn" data-act="cprev" ${C.at ? "" : "disabled"}>السابقة</button>
      <span class="pos">${C.at + 1} / ${ids.length}</span>
      <button class="btn" data-act="cnext" ${C.at < ids.length - 1 ? "" : "disabled"}>التالية</button>
    </div>`;
}

/* ---------- dialogs ---------- */
function openSheet(html, onMount){
  const layer = document.getElementById("layer");
  const back = document.activeElement;
  layer.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const sh = layer.querySelector(".sheet"); sh._back = back;
  if (onMount) onMount(sh);
  const f = sh.querySelector("input,textarea,button"); if (f) f.focus();
}
function closeSheet(){
  const layer = document.getElementById("layer"); const sh = layer.querySelector(".sheet");
  const back = sh && sh._back; layer.innerHTML = "";
  if (back && back.isConnected) back.focus({ preventScroll: true });
}
function wordForm(i, w){
  const d = S.decks[i];
  const title = w ? "تعديل الكلمة" : "كلمة جديدة";
  const sub = w ? esc(DEFAULT[i].ar) : `${esc(DEFAULT[i].ar)}، الخانة ${d.words.length + 1} من ${CAP}`;
  const v = k => esc(w ? (k === "en" ? w.en : k === "ar" ? w.ar : w.s[k] || "") : "");
  openSheet(`
    <h3>${title}</h3><p class="sub">${sub}</p>
    <form id="wf" novalidate>
      <div class="field"><label for="f-en">الكلمة الإنجليزية</label><input id="f-en" class="en" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="60" value="${v("en")}"><span class="err" id="e-en"></span></div>
      <div class="field"><label for="f-ar">المعنى العربي</label><input id="f-ar" autocomplete="off" maxlength="80" value="${v("ar")}"><span class="err" id="e-ar"></span></div>
      ${[0,1,2].map(k => `<div class="field"><label for="f-s${k}">الجملة ${["الأولى","الثانية","الثالثة"][k]}</label><textarea id="f-s${k}" class="en" dir="ltr" rows="2" maxlength="220" spellcheck="true">${v(k)}</textarea><span class="err" id="e-s${k}"></span></div>`).join("")}
      <div class="row2"><button class="btn primary" type="submit" style="--c:${COLORS[i]}">${w ? "احفظ التعديل" : "أضف الكلمة"}</button><button class="btn ghost" type="button" data-act="close">إلغاء</button></div>
    </form>`, sh => {
      const check = () => {
        const en = sh.querySelector("#f-en").value.trim();
        [0,1,2].forEach(k => { const t = sh.querySelector("#f-s"+k).value.trim(), e = sh.querySelector("#e-s"+k);
          if (e.classList.contains("err") && e.textContent && t) { e.textContent = ""; }
          if (t && en && !hasForm(t, en)) { e.className = "warn"; e.textContent = "الجملة لا تحتوي الكلمة. يمكنك الحفظ، لكن الأفضل أن تظهر الكلمة فيها."; }
          else if (e.className === "warn") { e.textContent = ""; e.className = "err"; } });
      };
      sh.addEventListener("input", ev => { const e = ev.target.nextElementSibling; if (e && e.className === "err") e.textContent = ""; check(); }); check();
      sh.querySelector("#wf").addEventListener("submit", ev => {
        ev.preventDefault();
        const en = sh.querySelector("#f-en").value.trim().replace(/\s+/g, " ");
        const ar = sh.querySelector("#f-ar").value.trim().replace(/\s+/g, " ");
        const s = [0,1,2].map(k => sh.querySelector("#f-s"+k).value.trim().replace(/\s+/g, " "));
        let bad = false; const err = (id, m) => { const e = sh.querySelector("#e-"+id); e.className = "err"; e.textContent = m; bad = true; };
        ["en","ar","s0","s1","s2"].forEach(id => { const e = sh.querySelector("#e-"+id); if (e.className === "err") e.textContent = ""; });
        if (!en) err("en", "اكتب الكلمة الإنجليزية.");
        else if (!/^[A-Za-z][A-Za-z' -]*$/.test(en)) err("en", "استعمل حروفًا إنجليزية فقط، ويُسمح بالمسافة والشرطة والفاصلة العليا.");
        else {
          const lower = en.toLowerCase();
          S.decks.forEach((dd, j) => dd.words.forEach(x => { if (x.en.toLowerCase() === lower && (!w || x.id !== w.id)) err("en", `هذه الكلمة موجودة في مرحلة «${DEFAULT[j].ar}».`); }));
        }
        if (!ar) err("ar", "اكتب المعنى العربي.");
        s.forEach((x, k) => { if (!x) err("s"+k, "اكتب جملة توضّح استعمال الكلمة."); });
        if (bad) { const f = sh.querySelector(".err:not(:empty)"); if (f) f.previousElementSibling.focus(); return; }
        if (w) { const changedEn = w.en.toLowerCase() !== en.toLowerCase(); w.en = en; w.ar = ar; w.s = s; if (changedEn) { w.st = ""; w.g = ""; } }
        else { if (d.words.length >= CAP) return closeSheet(); d.words.push({ id: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2,6), en, ar, s, g:"", st:"" }); }
        touch(i); closeSheet();
        if (!w) { VIEW.filter = "all"; VIEW.open = d.words[d.words.length - 1].id; }
        render();
        toast(w ? "حُفظ التعديل." : `أُضيفت «${en}».`);
      });
    });
}
function confirmSheet(title, body, yes, onYes, danger){
  openSheet(`<h3>${title}</h3><p class="sub">${body}</p><div class="row2"><button class="btn primary" data-act="yes" style="${danger ? "--c:var(--miss)" : ""}">${yes}</button><button class="btn ghost" data-act="close">إلغاء</button></div>`,
    sh => sh.querySelector('[data-act="yes"]').addEventListener("click", () => { closeSheet(); onYes(); }));
}
let DL = null;
function backupSheet(){
  const json = JSON.stringify({ app:"mufradati", v:1, saved: new Date().toISOString(), decks: S.decks });
  openSheet(`
    <h3>النسخ الاحتياطي</h3>
    <p class="sub">قائمتك محفوظة ${SYNC === "cloud" ? "في حسابك وفي هذا المتصفح" : "في هذا المتصفح فقط"}. خذ نسخة احتياطية قبل مسح بيانات المتصفح أو الانتقال لجهاز آخر.</p>
    <div class="row2" style="margin-bottom:18px">
      ${DL ? `<button class="btn primary" data-act="dl">${IC.save}نزّل ملف النسخة</button>` : ""}
      <button class="btn${DL ? "" : " primary"}" data-act="copy">انسخ النسخة</button>
    </div>
    <div class="field"><label for="imp">استرجاع نسخة</label>
      <textarea id="imp" class="en" dir="ltr" rows="3" placeholder="الصق نص النسخة هنا"></textarea>
      <span class="err" id="e-imp"></span></div>
    <div class="row2" style="margin-bottom:18px">
      <button class="btn" data-act="importtxt">استرجع من النص</button>
      <label class="btn" for="impf" style="cursor:pointer">اختر ملفًا</label><input id="impf" type="file" accept=".json,application/json" class="sr">
    </div>
    <div class="field"><label>البداية من جديد</label><p class="note" style="margin:0">يعيد المراحل العشر إلى كلماتها الأصلية ويمسح نتائج الاختبارات وكل ما أضفته.</p></div>
    <div class="row2"><button class="btn danger" data-act="reset">أعد كل شيء إلى البداية</button><button class="btn ghost" data-act="close">إغلاق</button></div>`,
    sh => {
      const msg = t => { const e = sh.querySelector("#e-imp"); e.textContent = t; };
      const imp = txt => {
        let o; try { o = JSON.parse(txt); } catch (e) { return msg("النص ليس نسخة صالحة. انسخه كاملًا كما هو."); }
        if (!o || !Array.isArray(o.decks) || o.decks.length !== DEFAULT.length) return msg("النص لا يحتوي مراحل مفرداتي العشر.");
        confirmSheet("استرجاع النسخة", "ستحل النسخة محل قائمتك الحالية كلها.", "استرجع", () => {
          S = { v:1, decks: o.decks.map(cleanDeck) }; S.decks.forEach((d, i) => touch(i)); go(""); render(); toast("استُرجعت النسخة.");
        });
      };
      sh.querySelector('[data-act="importtxt"]').addEventListener("click", () => { const t = sh.querySelector("#imp").value.trim(); if (!t) return msg("الصق نص النسخة أولًا."); imp(t); });
      sh.querySelector("#impf").addEventListener("change", ev => { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => imp(String(r.result)); r.readAsText(f); });
      sh.querySelector('[data-act="copy"]').addEventListener("click", async ev => {
        try { await navigator.clipboard.writeText(json); toast("نُسخت النسخة. احفظها في ملاحظاتك."); }
        catch (e) { const t = sh.querySelector("#imp"); t.value = json; t.select(); msg("لم يُسمح بالنسخ التلقائي. النص محدد في المربع، انسخه يدويًا."); }
      });
      const dlb = sh.querySelector('[data-act="dl"]');
      if (dlb) dlb.addEventListener("click", async () => {
        try { await DL.save({ filename: "mufradati-" + new Date().toISOString().slice(0,10) + ".json", data: json }); }
        catch (e) { msg("لم يكتمل التنزيل. جرّب «انسخ النسخة»."); }
      });
      sh.querySelector('[data-act="reset"]').addEventListener("click", () => confirmSheet("البداية من جديد", "ستعود المراحل العشر إلى كلماتها الأصلية، وتُمسح نتائجك وكل ما أضفته أو حذفته. لا يمكن التراجع.", "أعد كل شيء", () => { S = fresh(); S.decks.forEach((d, i) => touch(i)); go(""); render(); toast("عادت القوائم إلى البداية."); }, true));
    });
}
let toastT = 0;
function toast(text, undo){
  clearTimeout(toastT); const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `<span>${esc(text)}</span>${undo ? '<button type="button">تراجع</button>' : ""}`;
  document.body.appendChild(t);
  if (undo) t.querySelector("button").addEventListener("click", () => { undo(); t.remove(); });
  toastT = setTimeout(() => t.remove(), undo ? 6000 : 2600);
}

/* ---------- render & events ---------- */
function render(){
  const app = document.getElementById("app");
  let html = "", c = "";
  if (VIEW.name === "deck") { html = deckView(); c = COLORS[VIEW.i]; }
  else if (VIEW.name === "quiz" && Q) { html = quizView(); c = COLORS[Q.i]; }
  else if (VIEW.name === "cards" && C) { html = cardsView(); c = COLORS[C.i]; }
  else { VIEW = { name:"home" }; html = home(); }
  app.style.setProperty("--c", c || "var(--accent)");
  app.innerHTML = html;
}
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "scrim") { if (ev.target === el) closeSheet(); return; }
  if (a === "close") return closeSheet();
  if (a === "say") { ev.stopPropagation(); return speak(el.dataset.say); }
  if (a === "open") return go("deck-" + el.dataset.i);
  if (a === "home") return go("");
  if (a === "theme") { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem(KEY + ".theme", r.dataset.theme); } catch (e) {} return; }
  if (a === "backup") return backupSheet();
  if (a === "spotnext") { pickSpot(); return render(); }
  if (a === "filter") { VIEW.filter = el.dataset.f; return render(); }
  if (a === "toggle") { VIEW.open = VIEW.open === el.dataset.id ? null : el.dataset.id; return render(); }
  if (a === "add") return wordForm(VIEW.i);
  if (a === "edit") { const w = S.decks[VIEW.i].words.find(x => x.id === el.dataset.id); return w && wordForm(VIEW.i, w); }
  if (a === "del") {
    const i = VIEW.i, d = S.decks[i], j = d.words.findIndex(x => x.id === el.dataset.id); if (j < 0) return;
    const [w] = d.words.splice(j, 1); touch(i); render();
    return toast(`حُذفت «${w.en}».`, () => { if (d.words.length < CAP) { d.words.splice(Math.min(j, d.words.length), 0, w); touch(i); render(); } });
  }
  if (a === "quiz") return modeSheet(VIEW.i);
  if (a === "mode") { const m = el.dataset.m; PREF.mode = m; savePref(); closeSheet(); return startQuiz(+el.dataset.i, null, false, m); }
  if (a === "know") return judge(el.dataset.v === "1");
  if (a === "cards") return startCards(VIEW.i);
  if (a === "pick") return pick(+el.dataset.k);
  if (a === "tsfx") { PREF.sfx = !PREF.sfx; savePref(); el.setAttribute("aria-pressed", PREF.sfx); el.innerHTML = PREF.sfx ? IC.note : IC.noteoff; if (PREF.sfx) SFX.right(1); return; }
  if (a === "tvoice") { PREF.voice = !PREF.voice; savePref(); el.setAttribute("aria-pressed", PREF.voice); el.innerHTML = PREF.voice ? IC.say : IC.mute; if (!PREF.voice && canSpeak) { try { speechSynthesis.cancel(); } catch (e) {} } return; }
  if (a === "quit") return confirmSheet("إنهاء الاختبار؟", "لن تُحفظ إجابات هذا الاختبار.", "أنهِ الاختبار", () => { const i = Q.i; Q = null; go("deck-" + i); });
  if (a === "backdeck") { const i = VIEW.name === "cards" ? C.i : Q ? Q.i : VIEW.i; return go("deck-" + i); }
  if (a === "retry") return startQuiz(Q.i, null, false, Q.mode);
  if (a === "retrymiss") return startQuiz(Q.i, Q.miss.map(w => w.id), false, Q.mode);
  if (a === "flip") { C.flip = !C.flip; return render(); }
  if (a === "cnext") { C.at++; C.flip = false; return render(); }
  if (a === "cprev") { C.at = Math.max(0, C.at - 1); C.flip = false; return render(); }
  if (a === "cfilter") { C.missOnly = el.dataset.f === "m"; applyCardFilter(); return render(); }
  if (a === "cshuffle") { C.shuffled = !C.shuffled; applyCardFilter(); return render(); }
  if (a === "rate") {
    const d = S.decks[C.i], ids = C.order.filter(id => d.words.some(w => w.id === id)), w = d.words.find(x => x.id === ids[C.at]);
    if (w) { w.st = el.dataset.r; touch(C.i); }
    if (C.at < ids.length - 1) { C.at++; C.flip = false; } else toast("انتهت البطاقات.");
    return render();
  }
});
document.addEventListener("keydown", ev => {
  if (document.querySelector(".scrim")) { if (ev.key === "Escape") closeSheet(); return; }
  const t = ev.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  if (ev.key === "Enter" || ev.key === " ") {
    if (t && t.dataset && (t.dataset.act === "say" || t.dataset.act === "flip")) { ev.preventDefault(); t.click(); return; }
  }
  if (VIEW.name === "quiz" && Q && Q.at < Q.items.length) {
    if (Q.mode === "self") { if (ev.key === "1") { judge(true); return; } if (ev.key === "2") { judge(false); return; } }
    else if (/^[1-4]$/.test(ev.key)) { pick(+ev.key - 1); return; }
  }
  if (VIEW.name === "cards" && C) {
    if (ev.key === " " && !(t && t.closest && t.closest("button"))) { ev.preventDefault(); C.flip = !C.flip; render(); }
    else if (ev.key === "ArrowLeft") { document.querySelector('[data-act="cnext"]:not([disabled])')?.click(); }
    else if (ev.key === "ArrowRight") { document.querySelector('[data-act="cprev"]:not([disabled])')?.click(); }
  }
});
window.addEventListener("hashchange", route);

/* ---------- boot ---------- */
try { const th = localStorage.getItem(KEY + ".theme"); if (th === "dark" || th === "light") document.documentElement.dataset.theme = th; } catch (e) {}
S = loadLocal();
if (MIGRATED.size) { MIGRATED.forEach(i => { S.decks[i].u = Date.now(); }); saveLocal(); MIGRATED.clear(); }
route();
initCloud();
(async () => {
  try { if (window.claude && window.claude.use) DL = await window.claude.use("downloads"); } catch (e) { DL = null; }
  if (!DL) DL = { save: async ({ filename, data }) => {
    const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } };
})();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if (canSpeak) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {} }
